  // measure header and set CSS variable used for main padding
  function updateHeaderSpacing() {
    const header = document.querySelector('.header');
    if (!header) return;
    const top = parseFloat(getComputedStyle(header).top) || 0;
    const h = header.offsetHeight + top;
    document.documentElement.style.setProperty('--header-height', h + 'px');
  }
  window.addEventListener('load', updateHeaderSpacing);
  window.addEventListener('resize', updateHeaderSpacing);

  <script type="module">
    import createGlobe from 'https://unpkg.com/cobe@latest?module';

    const canvas = document.getElementById('cobe-canvas');

    const globe = createGlobe(canvas, {
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      width: 600 * 2,
      height: 600 * 2,
      phi: 0,
      theta: 0.2,
      dark: 1,
      diffuse: 0.9,
      mapSamples: 16000,
      mapBrightness: 2,
      baseColor: [1, 1, 1],
      markerColor: [0.2, 0.4, 1],
      glowColor: [0.3, 0.3, 0.3],
      markers: [],
      arcs: []
    });

    let phi = 0;
    function animate() {
      phi += 0.002; // subtle rotation
      globe.update({ phi });
      requestAnimationFrame(animate);
    }
    animate();

    // Make canvas responsive: adjust COBE size on resize
    function resizeGlobe() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const displaySize = Math.min(window.innerWidth * 0.9, 600);
      globe.update({ width: Math.round(displaySize * dpr), height: Math.round(displaySize * dpr) });
    }

    window.addEventListener('resize', resizeGlobe);
    // initial resize to match layout
    resizeGlobe();
  </script>

    function fitTextToBentoBox(textEl, boxSelector = '.bento-item-2', minPx = 10, maxPx = 30) {
      if (!textEl) return;
      const box = textEl.closest(boxSelector);
      if (!box) return;

      const fits = () => {
        return textEl.scrollHeight <= box.clientHeight && textEl.scrollWidth <= box.clientWidth;
      };

      let low = minPx;
      let high = maxPx;
      let best = minPx;

      while (low <= high) {
        const mid = Math.floor((low + high) / 2);
        textEl.style.fontSize = mid + 'px';

        if (fits()) {
          best = mid;
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      textEl.style.fontSize = best + 'px';

        text: "ENGLAND",
        items: {
          "bento-item-1": '<img class="flag-img" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f1ec-1f1e7.svg" alt="UK flag">',
          "bento-item-4": '<img class="dresden-img" src="tube.png" alt="Vande">',
          "bento-item-3": '<span class="year-sideways">2023</span>',
          "bento-item-5": '<span class="bounded-text">Tube</span>',
        }
      },
      {
        image: "jamaica.JPG",
        text: "JAMAICA",
        items: {
          "bento-item-1": '<img class="flag-img" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f1ef-1f1f2.svg" alt="Jamaica flag">',
          "bento-item-4": '<img class="dresden-img" src="walk.png" alt="Vande">',
          "bento-item-3": '<span class="year-sideways">2023</span>',
          "bento-item-5": '<span class="bounded-text">Walking</span>',
        }
      },
      {
        image: "fra.PNG",
        text: "FRANCE",
        items: {
          "bento-item-1": '<img class="flag-img" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f1eb-1f1f7.svg" alt="Jamaica flag">',
          "bento-item-4": '<img class="dresden-img" src="paris.jpg" alt="Paris Metro">',
          "bento-item-3": '<span class="year-sideways">2015</span>',
          "bento-item-5": '<span class="bounded-text">Métropolitain</span>',
        }
      },
    ];

    const flipContainer = document.getElementById("flip-container");
    const mainBoard = document.getElementById("main-board");
    let currentCardIndex = -1;

    // Create card elements with bento grid on the right
    if (flipContainer && cards.length > 0) {
      cards.forEach((cardData, index) => {
        const cardElement = document.createElement("div");
        cardElement.className = "card-wrapper";
        cardElement.id = `card-${index}`;

        // Left side: background image
        const bgSide = document.createElement("div");
        bgSide.className = "card-bg-side";
        bgSide.style.backgroundImage = `url("${cardData.image}")`;

        // Flipper for this card
        const flipper = document.createElement("div");
        flipper.className = "card-flipper";

        const board = document.createElement("div");
        board.className = "board card-board";

        flipper.appendChild(board);

        // Right side: bento grid
        const gridSide = document.createElement("div");
        gridSide.className = "bento-grid-side";

        // Define bento grid layout — each entry sets its bento class and default innerHTML
        const bentoLayout = [
          { class: "bento-item-1", html: "" },
          { class: "bento-item-2", html: '<span class="lorem-aino">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec tempor eros eget pulvinar accumsan. Aenean dui libero, volutpat eget nisi eget, aliquet placerat tellus. Maecenas aliquet est dignissim magna ultricies, eget finibus quam faucibus. Quisque commodo neque ut nunc rhoncus, at varius magna ornare.  Proin arcu enim, ultrices quis nisi vel, dictum lacinia est. Fusce nec risus finibus, hendrerit urna nec, ultrices neque. Pellentesque mattis mi metus, eget tristique ipsum imperdiet et. </span>' },
          { class: "bento-item-3", html: '<span class="year-sideways">2026</span>' },
          { class: "bento-item-4", html: "" },
          { class: "bento-item-5", html: "" },
        ];

        bentoLayout.forEach(item => {
          const bentoItem = document.createElement("div");
          bentoItem.className = `bento-item ${item.class}`;
          // Use card-specific content if available, otherwise layout default
          bentoItem.innerHTML = (cardData.items && cardData.items[item.class]) || item.html;
          gridSide.appendChild(bentoItem);
        });

        cardElement.appendChild(bgSide);
        cardElement.appendChild(flipper);
        cardElement.appendChild(gridSide);
        flipContainer.appendChild(cardElement);

        cardData.board = board;
      });
      // If the globe observer requested a desktop start before cards existed, start it now
      if (pendingDesktopStart) {
        const initialCardIndex = lastVisibleCardIndex >= 0 ? lastVisibleCardIndex : 0;
        // Start frozen desktop flipper into the shared mainBoard
        startFlipAnimation(initialCardIndex, mainBoard);
        desktopFlipperShown = true;
        pendingDesktopStart = false;
        // ensure shared flipper is visible and per-card flippers hidden
        if (fixedflipper) fixedflipper.style.display = 'flex';
        setCardFlippersVisible(false);
      }

      scheduleFitAllBentoText();

      // Convert bento-item-4 images to wrapping background scroll
      document.querySelectorAll('.bento-item-4 img').forEach(img => {
        const src = img.src || img.getAttribute('src');
        if (!src) return;
        const parent = img.parentElement;
        parent.style.backgroundImage = `url("${src}")`;
        parent.style.backgroundRepeat = 'repeat-x';
        parent.style.backgroundPosition = '0 50%';
        parent.style.backgroundSize = 'auto 100%';
        img.remove();
        const tempImg = new Image();
        tempImg.onload = () => {
          const ch = parent.clientHeight;
          if (ch <= 0) return;
          const aspect = tempImg.naturalWidth / tempImg.naturalHeight;
          const tileW = Math.round(ch * aspect);
          if (tileW <= 0) return;
          parent.animate([
            { backgroundPosition: '0px 50%' },
            { backgroundPosition: `-${tileW}px 50%` }
          ], { duration: 10000, iterations: Infinity, easing: 'linear' });
        };
        tempImg.src = src;
      });
    }

    function createChar(letter, delay, board) {
      const container = document.createElement("div");
      container.className = "char";

      const flip = document.createElement("div");
      flip.className = "flip";
      flip.textContent = " ";

      container.appendChild(flip);
      board.appendChild(container);

      let index = 0;

      const interval = setInterval(() => {
        flip.textContent = chars[index % chars.length];
        flip.classList.add("animate");

        setTimeout(() => flip.classList.remove("animate"), 300);

        if (chars[index % chars.length] === letter) {
          clearInterval(interval);
        }

        index++;
      }, 5 + delay);
    }

    function sizeFlipper(board) {
      const chars = board.querySelectorAll('.char');
      if (!chars.length) return;
      const parent = board.parentElement;
      if (!parent) return;
      parent.offsetHeight;
      const gap = 4;
      const pad = parseFloat(getComputedStyle(board).paddingLeft) * 2;
      const pw = parent.getBoundingClientRect().width;
      const bw = Math.min(pw, 640);
      const w = bw - pad;
      const n = chars.length;
      const cw = Math.max(6, Math.min(40, Math.floor((w - gap * (n - 1)) / n)));
      const ch = Math.round(cw * 1.5);
      const fs = Math.round(cw * 0.7);
      chars.forEach(el => {
        el.style.width = cw + 'px';
        el.style.height = ch + 'px';
        el.style.fontSize = fs + 'px';
      });
    }

    function startFlipAnimation(cardIndex, board = mainBoard) {
      if (!board || currentCardIndex === cardIndex && board === mainBoard) {
        return;
      }

      if (board === mainBoard) {
        currentCardIndex = cardIndex;
      }

      board.innerHTML = "";
      const text = cards[cardIndex].text;
      text.split("").forEach((letter, i) => {
        createChar(letter, i * 40, board);
      });
      requestAnimationFrame(() => sizeFlipper(board));
    }

    // Trigger animation when each card comes into view
    if (cards.length > 0 && flipContainer) {
      const observerOptions = isMobile
        ? { threshold: 0.05, rootMargin: '0px 0px -35% 0px' }
        : { threshold: 0.3 };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const cardId = entry.target.id;
            const cardIndex = parseInt(cardId.split("-")[1]);
            lastVisibleCardIndex = cardIndex;
            // If the desktop frozen shared flipper is active, always render into mainBoard
            if (!isMobile && desktopFlipperShown) {
              startFlipAnimation(cardIndex, mainBoard);
            } else {
              const cardBoard = cards[cardIndex].board || mainBoard;
              startFlipAnimation(cardIndex, cardBoard);
            }
          }
        });
      }, observerOptions);

      cards.forEach((_, index) => {
        const cardElement = document.getElementById(`card-${index}`);
        if (cardElement) {
          observer.observe(cardElement);
        }
      });
    }

    if (isMobile) {
      if (fixedflipper) {
        fixedflipper.style.display = "none";
        setCardFlippersVisible(true);
      }
      cards.forEach((cardData, index) => {
        if (cardData.board) {
          startFlipAnimation(index, cardData.board);
        }
      });
    }

    window.addEventListener('resize', scheduleFitAllBentoText);

    let rf = null;
    window.addEventListener('resize', () => {
      if (rf) cancelAnimationFrame(rf);
      rf = requestAnimationFrame(() => {
        if (!isMobile && desktopFlipperShown) {
          sizeFlipper(mainBoard);
        } else {
          cards.forEach(c => { if (c.board) sizeFlipper(c.board); });
        }
        rf = null;
      });
    });
  </script>
